<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../scripts/images/theme.css"><script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../../scripts/images/connect.js"></script>
<style>
.frame{padding:0}
.t{position:absolute;left:64px;top:50px;font-size:74px;font-weight:900;line-height:.98;letter-spacing:-.025em;color:var(--title)}
.s{position:absolute;left:66px;top:212px;font-size:34px;font-weight:700;color:var(--accent)}
.card{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.card .label{font-size:24px}
.code{left:64px;top:300px;width:150px;height:140px}
.code .icon{width:60px;height:60px}
.pipe{left:250px;top:300px;width:250px;height:140px}
.track{display:flex;align-items:center;gap:0}
.track i{display:block;width:20px;height:20px;border-radius:50%}
.track b{display:block;width:46px;height:3px}
.env{top:420px;width:190px;height:200px;justify-content:flex-start;padding-top:22px}
.env .hd{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;color:var(--title);align-self:flex-start;margin-left:22px}
.env .hd i{width:16px;height:16px;border-radius:50%;display:block}
.env .icon{width:84px;height:84px;margin-top:16px}
.env .icon svg{stroke-width:1.6px}
</style></head><body data-size="1200x675"><div class="frame">
<div class="t">DevOps for Azure<br>Terraform &amp; CI/CD</div>
<div class="s">Multi-environment provisioning</div>
<div class="card code" id="code"><span class="icon"><i data-lucide="code-xml"></i></span><div class="label">Code</div></div>
<div class="card pipe" id="pipe"><div class="track"><i style="background:#b9a3ec"></i><b style="background:linear-gradient(90deg,#b9a3ec,var(--accent))"></b><i style="background:var(--accent)"></i><b style="background:linear-gradient(90deg,var(--accent),var(--success))"></b><i style="background:var(--success)"></i></div><div class="label">Pipeline</div></div>
<div class="card env" id="dev" style="left:546px"><div class="hd"><i style="background:#b9a3ec"></i>DEV</div><span class="icon"><i data-lucide="boxes"></i></span></div>
<div class="card env" id="qa" style="left:751px"><div class="hd"><i style="background:var(--accent)"></i>QA</div><span class="icon"><i data-lucide="boxes"></i></span></div>
<div class="card env tint-success" id="prod" style="left:956px"><div class="hd"><i style="background:var(--success)"></i>PROD</div><span class="icon"><i data-lucide="boxes"></i></span></div>
</div>
<script>LINKS=[{from:"code",to:"pipe",path:"cc",color:"var(--info)",width:2.5},
...["dev","qa","prod"].map(id=>({from:"pipe",to:id,path:"elbow",color:"var(--info)",width:3}))];</script>
</body></html>
