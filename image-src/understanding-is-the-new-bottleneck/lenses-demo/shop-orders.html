<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online shop — from checkout to dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f9; --panel:#ffffff; --ink:#22202a; --ink-dim:#515455; --rule:#e6e1ec; --head:#320063;
  --accent:#EA2775; --accent-ink:#ffffff; --code-bg:#f1edf5; --shadow:0 6px 24px rgba(50,0,99,.10);
  --good:#320063; --good-bg:#ebe5f3; --warn:#a4473a; --warn-bg:#fdece9;
  --bad:#c4145c; --bad-bg:#fde6ef; --accentTone:#7D1C4B; --accentTone-bg:#f6e6ee;
  --neutral:#515455; --neutral-bg:#ecebee; --ok:#1f7a4d; --ok-bg:#e3f3ea; --no:#b3261e; --no-bg:#fbe6e4;
  --hl:#fde6ef;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Nunito',Arial,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17121f; --panel:#211a2b; --ink:#efeaf5; --ink-dim:#b3adbf; --rule:#3a3147; --head:#d9c9f2;
    --accent:#F0559A; --accent-ink:#17121f; --code-bg:#2a2235; --shadow:0 6px 24px rgba(0,0,0,.45);
    --good:#c4aef0; --good-bg:#2d2142; --warn:#f3a596; --warn-bg:#3d2420;
    --bad:#ff6fa6; --bad-bg:#43172b; --accentTone:#e59bbf; --accentTone-bg:#3a1a2a;
    --neutral:#c9c5d1; --neutral-bg:#2d2834; --ok:#7fd3a6; --ok-bg:#1b3327; --no:#f29182; --no-bg:#3d1f19;
    --hl:#3d2440;
  }
}
:root[data-theme="dark"]{
  --bg:#17121f; --panel:#211a2b; --ink:#efeaf5; --ink-dim:#b3adbf; --rule:#3a3147; --head:#d9c9f2;
  --accent:#F0559A; --accent-ink:#17121f; --code-bg:#2a2235; --shadow:0 6px 24px rgba(0,0,0,.45);
  --good:#c4aef0; --good-bg:#2d2142; --warn:#f3a596; --warn-bg:#3d2420;
  --bad:#ff6fa6; --bad-bg:#43172b; --accentTone:#e59bbf; --accentTone-bg:#3a1a2a;
  --neutral:#c9c5d1; --neutral-bg:#2d2834; --ok:#7fd3a6; --ok-bg:#1b3327; --no:#f29182; --no-bg:#3d1f19;
  --hl:#3d2440;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15.5px; line-height:1.55;}
a{color:var(--accent);}
code{font-family:var(--mono); background:var(--code-bg); padding:1px 5px; border-radius:5px; font-size:.86em;}
pre{font-family:var(--mono); background:var(--code-bg); padding:12px 14px; border-radius:10px; overflow:auto; font-size:13px;}
button{font:inherit;}

header.top{
  position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--rule);
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; padding:12px 22px;
}
.brand h1{font-size:17px; margin:0; letter-spacing:-.01em;}
.brand .sub{color:var(--ink-dim); font-size:12.5px;}
.lens-tabs{display:flex; flex-wrap:wrap; gap:4px; flex:1;}
.lens-tab{
  border:1px solid var(--rule); background:var(--panel); color:var(--ink-dim); border-radius:99px;
  padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none;
}
.lens-tab:hover{color:var(--ink);}
.lens-tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.top-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.legend{display:flex; flex-wrap:wrap; gap:6px;}
.btn{border:1px solid var(--rule); background:var(--panel); color:var(--ink); border-radius:99px; padding:6px 12px; font-size:12.5px; cursor:pointer;}
.btn:hover{border-color:var(--ink-dim);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn:focus-visible,.lens-tab:focus-visible,.choice:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.tag{display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px;
  text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; vertical-align:2px;}
.tone-good{color:var(--good); background:var(--good-bg);}
.tone-warn{color:var(--warn); background:var(--warn-bg);}
.tone-bad{color:var(--bad); background:var(--bad-bg);}
.tone-accent{color:var(--accentTone); background:var(--accentTone-bg);}
.tone-neutral{color:var(--neutral); background:var(--neutral-bg);}
.tone-ok{color:var(--ok); background:var(--ok-bg);}
.tone-no{color:var(--no); background:var(--no-bg);}

main#stage{padding:0;}
.lens{display:block;}
.lens[hidden]{display:none;}
.wrap{max-width:1180px; margin:0 auto; padding:26px 24px 120px;}
.hint{color:var(--ink-dim); font-size:13.5px; margin:0 0 14px; max-width:860px;}
.card{background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:18px 20px; margin-bottom:14px;}
.toolbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px;}
.toolbar .spacer{flex:1;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{font-size:12px; border:1px solid var(--rule); border-radius:99px; padding:2px 10px; text-decoration:none; color:var(--ink-dim); background:var(--panel);}
.chip:hover{color:var(--accent); border-color:var(--accent);}
.muted{color:var(--ink-dim);}

.blocks p{margin:0 0 12px;}
.blocks ul,.blocks ol{margin:0 0 12px; padding-left:20px;}
.blocks li{margin-bottom:5px;}
.blocks .quote{border-left:3px solid var(--accent); padding:2px 0 2px 14px; margin:12px 0; font-style:italic; color:var(--ink-dim);}
.blocks .quote cite{display:block; font-style:normal; font-size:12px; margin-top:4px;}
.blocks .note{border:1px dashed var(--accent); border-radius:12px; padding:12px 16px; margin:12px 0;}
.blocks .note h4{margin:0 0 6px; font-size:13.5px; color:var(--accent);}
.blocks table{width:100%; border-collapse:collapse; font-size:13.5px; margin:10px 0 16px;}
.blocks th,.blocks td{text-align:left; padding:7px 9px; border-bottom:1px solid var(--rule); vertical-align:top;}
.blocks th{color:var(--ink-dim); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
.table-scroll{overflow-x:auto;}

.diagram{background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:16px; overflow:auto; min-height:120px;}
.diagram svg{display:block; margin:0 auto; max-width:none;}
.diagram .err{color:var(--bad); font-family:var(--mono); font-size:12.5px; white-space:pre-wrap;}
.diagram .node.pulse rect,.diagram .node.pulse polygon,.diagram .node.pulse circle,.diagram .node.pulse path{stroke:var(--accent) !important; stroke-width:4px !important;}
.diagram .node{cursor:pointer;}
.diagram .cluster rect{fill:var(--bg) !important; stroke:var(--rule) !important;}
.diagram span.edgeLabel, .diagram .edgeLabel p{background-color:var(--panel) !important; color:var(--ink-dim) !important;}
.diagram .edgeLabel rect, .diagram .labelBkg{fill:var(--panel) !important; background-color:var(--panel) !important;}
.diagram .cluster .cluster-label, .diagram .cluster-label span, .diagram .cluster text{color:var(--ink-dim) !important; fill:var(--ink-dim) !important;}

.panel{
  position:fixed; top:0; right:0; bottom:0; width:min(420px,100vw); z-index:30; background:var(--panel);
  border-left:1px solid var(--rule); box-shadow:var(--shadow); padding:22px 22px 60px; overflow-y:auto;
  transform:translateX(105%); transition:transform .18s ease;
}
.panel.open{transform:none;}
.panel h2{font-size:17px; margin:0 26px 8px 0;}
.panel .close{position:absolute; top:14px; right:14px; background:none; border:none; color:var(--ink-dim); font-size:22px; cursor:pointer; line-height:1;}
.panel .ptags{margin-bottom:12px; display:flex; gap:6px; flex-wrap:wrap;}
.panel .scenario-note{background:var(--hl); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13.5px;}
.panel .links{margin-top:14px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:600;}

/* reference */
.ref{display:flex; gap:28px; max-width:1180px; margin:0 auto; padding:0 24px;}
.ref nav.toc{width:240px; flex:none; position:sticky; top:62px; align-self:flex-start; max-height:calc(100vh - 70px); overflow-y:auto; padding:24px 0;}
.ref nav.toc a{display:block; padding:5px 10px; border-radius:8px; color:var(--ink-dim); text-decoration:none; font-size:13px; border-left:2px solid transparent;}
.ref nav.toc a.active{color:var(--accent); border-left-color:var(--accent); background:var(--panel); font-weight:600;}
.ref .content{flex:1; min-width:0; max-width:820px; padding:26px 0 140px;}
.ref .overview{border-bottom:1px solid var(--rule); padding-bottom:22px; margin-bottom:34px;}
.ref .overview h2{font-size:26px; margin:0 0 8px;}
.ref section.sec{margin-bottom:46px; scroll-margin-top:80px;}
.ref section.sec h3{font-size:20px; margin:0 0 6px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;}
.ref section.sec .num{color:var(--accent); font-family:var(--mono); font-size:13px;}
.ref section.sec .summary{color:var(--ink-dim); margin:0 0 14px;}
.ref section.sec.flash{animation:flash 1.4s ease;}
@keyframes flash{0%{background:var(--hl);}100%{background:transparent;}}
.suggest li{margin-bottom:6px;}

/* questions */
.qgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px;}
.qcard h3{font-size:15.5px; margin:6px 0 8px;}
.qcard.flash{animation:flash 1.4s ease;}
.qmeta{font-size:12.5px; color:var(--ink-dim);}

/* quiz */
.quiz{max-width:720px;}
.quiz .q{font-size:19px; font-weight:600; margin:6px 0 16px;}
.choice{display:block; width:100%; text-align:left; border:1px solid var(--rule); background:var(--panel); color:var(--ink); border-radius:10px; padding:11px 14px; margin-bottom:8px; cursor:pointer;}
.choice:hover{border-color:var(--ink-dim);}
.choice.right{border-color:var(--ok); background:var(--ok-bg);}
.choice.wrong{border-color:var(--no); background:var(--no-bg);}
.reveal{margin-top:14px; border-top:1px solid var(--rule); padding-top:14px;}
.progress{height:4px; background:var(--rule); border-radius:4px; margin-bottom:16px; overflow:hidden;}
.progress > div{height:100%; background:var(--accent); width:0; transition:width .2s;}

/* walkthrough */
.walk{display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:18px; align-items:start;}
.walk .step h3{margin:4px 0 10px; font-size:17px;}
.walk .stepnum{font-family:var(--mono); color:var(--accent); font-size:12.5px;}
.walk .trail{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px;}
.walk .trail span{font-size:11.5px; color:var(--ink-dim);}
section[data-lens="walkthrough"] .wrap{max-width:none; padding-bottom:16px;}
.walk > *{min-width:0;}
.walk .step{position:sticky; top:72px; max-height:calc(100vh - 92px); overflow-y:auto;}
.walk .diagram{height:calc(100vh - 215px); min-height:380px;}
.walk .diagram g.node rect, .walk .diagram g.node polygon, .walk .diagram g.node circle,
.walk .diagram g.node path, .walk .diagram g.node ellipse{fill:#9a97a3 !important; stroke:none !important;}
.walk .diagram g.node .nodeLabel, .walk .diagram g.node .label, .walk .diagram g.node text{color:#fff !important; fill:#fff !important;}
.walk .diagram g.node.wk-on rect, .walk .diagram g.node.wk-on polygon, .walk .diagram g.node.wk-on circle,
.walk .diagram g.node.wk-on path, .walk .diagram g.node.wk-on ellipse{fill:#EA2775 !important; stroke:#ffffff !important; stroke-width:3px !important;}
.walk .diagram g.node.wk-off{opacity:.45;}
.walk .diagram g.node{transition:opacity .25s;}
.walk .prompt{margin:14px 0 8px; font-weight:600;}
.walk .story-answer{font-weight:600; color:var(--accent);}
.walk .choice .mark{font-weight:800; margin-right:8px;}
.walk .choice.right .mark{color:var(--ok);}
.walk .choice.wrong .mark{color:var(--no);}
.walk .choice.dim{opacity:.5;}
.walk .choice:disabled{cursor:default;}
.walk .answer-box p{margin:10px 0 8px;}
.verdict{border-radius:10px; padding:9px 12px; margin-bottom:12px; font-weight:700; font-size:14px;}
.verdict.bad{color:var(--no); background:var(--no-bg);}
.verdict.good{color:var(--ok); background:var(--ok-bg);}

@media (max-width:900px){
  .ref nav.toc{display:none;}
  .walk{grid-template-columns:1fr;}
  .walk .step{position:static; max-height:none;}
  .walk .diagram{height:60vh;}
  .wrap{padding:20px 16px 100px;}
  .ref{padding:0 16px;}
  header.top{padding:10px 16px;}
}

/* Tecknoworks: headings in deep purple, Nunito throughout */
.brand h1, .ref .overview h2, .ref section.sec h3, .panel h2, .walk .step h3, .qcard h3, .quiz .q, h3{color:var(--head); font-family:var(--sans);}
.brand h1{font-weight:800;}

</style>
</head>

  <div class="pbody"></div>

</aside>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
(function () {
  'use strict';

  var model = JSON.parse(document.getElementById('model-data').textContent);
  var registry = {};
  var state = {};
  var enabled = [];
  var current = null;
  var report = { errors: [], diagrams: [], lenses: [] };
  window.__lensReport = report;

  var DEFAULT_LEGEND = [
    { id: 'confirmed', label: 'Confirmed', tone: 'good', description: 'Stated by the source and checked' },
    { id: 'inferred', label: 'Inferred', tone: 'warn', description: 'Best reading, not stated outright' },
    { id: 'open', label: 'Open', tone: 'bad', description: 'Unresolved, contradictory or unknown' }
  ];
  var legend = (model.legend && model.legend.length) ? model.legend : DEFAULT_LEGEND;
  var legendById = {};
  legend.forEach(function (l) { legendById[l.id] = l; });

  // Mermaid needs literal colours. Tecknoworks palette: deep purple, coral, magenta, plum, dark gray.
  var FILL = { good: '#320063', warn: '#EA8170', bad: '#EA2775', accent: '#7D1C4B', neutral: '#515455', muted: '#9a97a3' };
  // Coral is too light for white text, so it takes deep purple.
  var TEXT = { good: '#fff', warn: '#320063', bad: '#fff', accent: '#fff', neutral: '#fff', muted: '#fff' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function tone(status) {
    var l = legendById[status];
    return l ? (l.tone || 'neutral') : 'neutral';
  }

  function tag(status, labelOverride) {
    if (!status) return '';
    var l = legendById[status];
    var label = labelOverride || (l ? l.label : status);
    return '<span class="tag tone-' + tone(status) + '" title="' + esc(l && l.description || '') + '">' + esc(label) + '</span>';
  }

  function toneTag(t, label) {
    return '<span class="tag tone-' + t + '">' + esc(label) + '</span>';
  }

  // Escapes first, then applies a small markdown subset, so source text can never inject HTML.
  function inline(s) {
    var parts = String(s == null ? '' : s).split(/(`[^`]+`)/);
    return parts.map(function (p, i) {
      if (i % 2 === 1) return '<code>' + esc(p.slice(1, -1)) + '</code>';
      var h = esc(p);
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/(^|[^\w*])\*(?!\s)([^*]+?)\*(?![\w*])/g, '$1<em>$2</em>');
      h = h.replace(/\{\{([\w-]+)\}\}/g, function (m, id) { return legendById[id] ? tag(id) : m; });
      h = h.replace(/\[\[([a-z][\w-]*):([A-Za-z0-9_.-]+)(?:\|(.+?))?\]\]/g, function (m, lens, id, label) {
        var text = label || esc(xrefName(lens, id));
        // A link into a lens that is not built would be dead; show its name as plain text instead.
        if (enabled.length && !isEnabled(lens)) return '<strong>' + text + '</strong>';
        return '<a class="xref" href="#' + lens + '/' + id + '">' + text + '</a>';
      });
      return h;
    }).join('');
  }

  function byId(list, id) { return (list || []).filter(function (x) { return x.id === id; })[0]; }

  function xrefName(lens, id) {
    var parts = id.split('.'), hit;
    if (lens === 'map') hit = byId(model.map && model.map.nodes, id), hit = hit && String(hit.label || '').replace(/\s*\n\s*/g, ' ');
    else if (lens === 'reference') hit = byId(model.sections, id), hit = hit && hit.title;
    else if (lens === 'questions') hit = byId(model.questions, id), hit = hit && hit.title;
    else if (lens === 'states') {
      var mc = byId(model.machines, parts[0]);
      var st = mc && parts[1] ? byId(mc.states, parts[1]) : null;
      hit = st ? String(st.label || st.id).replace(/\s*\n\s*/g, ' ') : (mc && mc.title);
    } else if (lens === 'walkthrough') {
      var w = byId(model.walkthroughs, parts[0]);
      var sp = w && parts[1] ? byId(w.steps, parts[1]) : null;
      hit = sp ? sp.title : (w && w.title);
    }
    return hit || id;
  }

  function block(b) {
    if (typeof b === 'string') b = { type: 'p', text: b };
    var t = b.status ? tag(b.status) + ' ' : '';
    switch (b.type) {
      case 'quote':
        return '<div class="quote">' + t + '“' + inline(b.text) + '”' +
          (b.cite ? '<cite>— ' + inline(b.cite) + '</cite>' : '') + '</div>';
      case 'list': {
        var tn = b.ordered ? 'ol' : 'ul';
        var head = (t || b.title) ? '<p>' + t + (b.title ? '<strong>' + inline(b.title) + '</strong>' : '') + '</p>' : '';
        return head + '<' + tn + '>' + (b.items || []).map(function (it) {
          if (it && typeof it === 'object') return '<li>' + (it.status ? tag(it.status) + ' ' : '') + inline(it.text) + '</li>';
          return '<li>' + inline(it) + '</li>';
        }).join('') + '</' + tn + '>';
      }
      case 'table': {
        var cap = (t || b.caption) ? '<p>' + t + (b.caption ? '<strong>' + inline(b.caption) + '</strong>' : '') + '</p>' : '';
        return cap + '<div class="table-scroll"><table><thead><tr>' +
          (b.head || []).map(function (h) { return '<th>' + inline(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + (b.rows || []).map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      }
      case 'note':
        return '<div class="note">' + (b.title ? '<h4>' + inline(b.title) + '</h4>' : '') + t +
          blocks(b.blocks || b.text) + '</div>';
      case 'code':
        return '<pre><code>' + esc(b.text) + '</code></pre>';
      default:
        return '<p>' + t + inline(b.text || '') + '</p>';
    }
  }

  function blocks(list) {
    if (!list) return '';
    if (typeof list === 'string') list = [{ type: 'p', text: list }];
    return '<div class="blocks">' + list.map(block).join('') + '</div>';
  }

  // ---------- panel ----------
  var panel = document.getElementById('panel');
  function openPanel(o) {
    panel.querySelector('.ptitle').textContent = o.title || '';
    panel.querySelector('.ptags').innerHTML = (o.tags || []).filter(Boolean).join(' ');
    panel.querySelector('.pbody').innerHTML = (o.pre || '') + blocks(o.blocks) + (o.post || '');
    panel.querySelector('.links').innerHTML = (o.links || []).map(function (l) {
      return '<a href="' + esc(l.href) + '">' + esc(l.label) + '</a>';
    }).join('');
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    panel.scrollTop = 0;
  }
  function closePanel() {
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
  }
  panel.querySelector('.close').addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  // ---------- lookups ----------
  function mapNodes() { return (model.map && model.map.nodes) || []; }
  function findNode(id) { return mapNodes().filter(function (n) { return n.id === id; })[0]; }
  function findSection(id) { return (model.sections || []).filter(function (s) { return s.id === id; })[0]; }
  function plain(label) { return String(label || '').replace(/\s*\n\s*/g, ' '); }
  function lensTitle(id) { return registry[id] ? registry[id].title : id; }
  function isEnabled(id) { return enabled.indexOf(id) !== -1; }

  function openNode(n, pre) {
    var links = [];
    if (n.section && isEnabled('reference')) {
      var s = findSection(n.section);
      links.push({ href: '#reference/' + n.section, label: 'Read in Reference: ' + (s ? s.title : n.section) + ' →' });
    }
    if (isEnabled('questions')) {
      (model.questions || []).forEach(function (q) {
        if ((q.affects || []).indexOf(n.id) !== -1) links.push({ href: '#questions/' + q.id, label: 'Open question: ' + q.title + ' →' });
      });
    }
    openPanel({ title: plain(n.label || n.id), tags: [tag(n.status)], pre: pre, blocks: n.detail, links: links });
  }

  // ---------- mermaid ----------
  var clickTargets = {};
  var seq = 0;
  function clickId(prefix, fn) {
    var id = (prefix || 'c') + (seq++);
    clickTargets[id] = fn;
    return id;
  }
  window.__lensClick = function (id) { var fn = clickTargets[id]; if (fn) fn(); };

  // Numeric entities: mermaid parses these inside quoted labels; raw quotes/brackets would break the grammar.
  function mlabel(s) {
    return String(s == null ? '' : s)
      .replace(/#/g, '#35;').replace(/"/g, '#34;').replace(/</g, '#60;').replace(/>/g, '#62;')
      .replace(/\r?\n/g, '<br/>');
  }

  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function statusClassDefs() {
    var defs = { st__none: 'fill:' + FILL.neutral + ',color:' + TEXT.neutral + ',stroke:none' };
    legend.forEach(function (l) {
      defs['st_' + safeClass(l.id)] = 'fill:' + (FILL[l.tone] || FILL.neutral) + ',color:' + (TEXT[l.tone] || '#fff') + ',stroke:none';
    });
    return defs;
  }
  function safeClass(s) { return String(s).replace(/[^A-Za-z0-9]/g, '_'); }
  function statusClass(status) { return status && legendById[status] ? 'st_' + safeClass(status) : 'st__none'; }

  // Rendering each diagram on its own via mermaid.render() from a JS string avoids two failure modes:
  // batch run() over several elements corrupting layout, and textContent of a parsed div dropping <br/>.
  async function renderMermaid(el, code, name) {
    if (!window.mermaid) {
      el.innerHTML = '<div class="err">The diagram library did not load (offline?). The other lenses still work.</div>';
      report.errors.push({ where: name, error: 'mermaid not loaded' });
      return null;
    }
    window.mermaid.initialize({
      startOnLoad: false, securityLevel: 'loose', theme: isDark() ? 'dark' : 'default', fontFamily: 'inherit',
      flowchart: { htmlLabels: true, useMaxWidth: false, curve: 'basis' }
    });
    var id = 'lensmm' + (seq++);
    try {
      var out = await window.mermaid.render(id, code);
      el.innerHTML = out.svg;
      if (out.bindFunctions) out.bindFunctions(el);
      var svg = el.querySelector('svg');
      var vb = svg && svg.viewBox && svg.viewBox.baseVal;
      var w = vb ? vb.width : 0, h = vb ? vb.height : 0;
      var entry = { name: name, width: Math.round(w), height: Math.round(h), ok: w > 40 && h > 20 };
      report.diagrams = report.diagrams.filter(function (d) { return d.name !== name; }).concat([entry]);
      if (!entry.ok) report.errors.push({ where: name, error: 'diagram collapsed to ' + w + 'x' + h });
      return svg;
    } catch (e) {
      var msg = String(e && e.message || e);
      el.innerHTML = '<div class="err">Diagram error in ' + esc(name) + ':\n' + esc(msg) + '</div>';
      report.errors.push({ where: name, error: msg });
      var stray = document.getElementById('d' + id);
      if (stray) stray.remove();
      return null;
    }
  }

  function buildFlow(o) {
    var lines = ['flowchart ' + (o.direction || 'LR')];
    var ids = {};
    o.nodes.forEach(function (n) {
      ids[n.id] = o.onClick ? clickId('n', function () { o.onClick(n); }) : ('x' + (seq++));
    });
    function shape(n) {
      var L = '"' + mlabel(o.labelFor ? o.labelFor(n) : (n.label || n.id)) + '"';
      switch (n.shape) {
        case 'round': return '(' + L + ')';
        case 'pill': return '([' + L + '])';
        case 'diamond': return '{' + L + '}';
        case 'circle': return '((' + L + '))';
        case 'db': return '[(' + L + ')]';
        default: return '[' + L + ']';
      }
    }
    function decl(n) { return '    ' + ids[n.id] + shape(n) + (o.classFor ? ':::' + o.classFor(n) : ''); }
    var groupIds = {};
    (o.groups || []).forEach(function (g, gi) {
      var members = o.nodes.filter(function (n) { return n.group === g.id; });
      if (!members.length) return;
      groupIds[g.id] = true;
      lines.push('  subgraph sg' + gi + '["' + mlabel(g.label || g.id) + '"]');
      if (g.direction) lines.push('    direction ' + g.direction);
      members.forEach(function (n) { lines.push(decl(n)); });
      lines.push('  end');
    });
    o.nodes.forEach(function (n) { if (!n.group || !groupIds[n.group]) lines.push(decl(n)); });
    (o.edges || []).forEach(function (e) {
      var a = ids[e.from], b = ids[e.to];
      if (!a || !b) return;
      var L = e.label ? '"' + mlabel(e.label) + '"' : null;
      var arrow;
      if (e.style === 'dashed') arrow = L ? ' -. ' + L + ' .-> ' : ' -.-> ';
      else if (e.style === 'thick') arrow = L ? ' == ' + L + ' ==> ' : ' ==> ';
      else if (e.style === 'line') arrow = L ? ' -- ' + L + ' --- ' : ' --- ';
      else arrow = L ? ' -- ' + L + ' --> ' : ' --> ';
      lines.push('  ' + a + arrow + b);
    });
    var defs = o.classDefs || {};
    Object.keys(defs).forEach(function (k) { lines.push('  classDef ' + k + ' ' + defs[k] + ';'); });
    if (o.onClick) o.nodes.forEach(function (n) { lines.push('  click ' + ids[n.id] + ' __lensClick'); });
    return { code: lines.join('\n'), ids: ids };
  }

  function highlight(container, mid) {
    var g = container.querySelector('g.node[id^="flowchart-' + mid + '-"]');
    if (!g) return;
    g.classList.add('pulse');
    g.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
    setTimeout(function () { g.classList.remove('pulse'); }, 2200);
  }

  // Diagrams render at natural size; the user picks fit or zoom instead of text shrinking unreadably.
  function zoomable(container, svg, controlsHost) {
    var vb = svg.viewBox.baseVal;
    var natural = vb && vb.width ? vb.width : svg.getBoundingClientRect().width;
    if (!container._zoom) {
      container._zoom = { mode: 'auto', scale: 1 };
      var bar = document.createElement('span');
      bar.className = 'zoombar';
      bar.innerHTML = '<button class="btn" data-z="out" type="button" aria-label="Zoom out">−</button> ' +
        '<button class="btn" data-z="fit" type="button">Fit</button> ' +
        '<button class="btn" data-z="in" type="button" aria-label="Zoom in">+</button>';
      if (controlsHost) {
        var sp = document.createElement('span'); sp.className = 'spacer';
        controlsHost.appendChild(sp);
        controlsHost.appendChild(bar);
      }
      bar.addEventListener('click', function (e) {
        var z = e.target.getAttribute('data-z');
        if (!z) return;
        var st = container._zoom;
        if (z === 'fit') st.mode = 'fit';
        else { st.mode = 'manual'; st.scale = Math.max(0.3, Math.min(3, st.scale * (z === 'in' ? 1.25 : 0.8))); }
        apply();
      });
    }
    function fitScale() {
      var avail = container.clientWidth - 34;
      return avail > 0 && natural > 0 ? Math.min(1, avail / natural) : 1;
    }
    function apply() {
      var s = container.querySelector('svg');
      if (!s) return;
      var st = container._zoom;
      if (st.mode !== 'manual') st.scale = fitScale();
      s.style.width = Math.round(natural * st.scale) + 'px';
      s.style.height = 'auto';
    }
    container._applyZoom = apply;
    apply();
  }

  // ---------- theme ----------
  try {
    var savedTheme = localStorage.getItem('lens-theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (e) { /* storage unavailable: follow system theme */ }

  function rethemeRendered() {
    Object.keys(state).forEach(function (id) {
      if (state[id].rendered && registry[id].onTheme) {
        Promise.resolve(registry[id].onTheme(api)).catch(function (err) { report.errors.push({ where: id + ':theme', error: String(err) }); });
      }
    });
  }
  function toggleTheme() {
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('lens-theme', next); } catch (e) { /* ignore */ }
    rethemeRendered();
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function () { if (!document.documentElement.getAttribute('data-theme')) rethemeRendered(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }

  window.addEventListener('resize', function () {
    document.querySelectorAll('.diagram').forEach(function (d) { if (d._applyZoom) d._applyZoom(); });
  });

  // ---------- routing ----------
  function route() {
    var raw = location.hash.replace(/^#/, '');
    var parts = raw.split('/');
    var lensId = parts.shift();
    var item = parts.length ? decodeURIComponent(parts.join('/')) : null;
    if (!isEnabled(lensId)) { lensId = enabled[0]; item = null; }
    activate(lensId, item);
  }

  function activate(id, item) {
    if (!id) return;
    if (id !== current) closePanel();
    enabled.forEach(function (lid) {
      state[lid].el.hidden = lid !== id;
      state[lid].tab.setAttribute('aria-selected', lid === id ? 'true' : 'false');
    });
    var def = registry[id], st = state[id];
    if (!st.rendered) {
      st.rendered = true;
      st.ready = Promise.resolve().then(function () { return def.render(st.el, api); }).catch(function (err) {
        report.errors.push({ where: id, error: String(err && err.stack || err) });
        st.el.innerHTML = '<div class="wrap"><div class="card err">This lens failed to render: ' + esc(String(err)) + '</div></div>';
      });
    }
    st.ready.then(function () {
      st.el.querySelectorAll('.diagram').forEach(function (d) { if (d._applyZoom) d._applyZoom(); });
      // Deferred: on first load the browser's own hash handling would cancel an immediate smooth scroll.
      if (item && def.focus) requestAnimationFrame(function () { setTimeout(function () { def.focus(item, api); }, 40); });
    });
    current = id;
  }

  // Re-clicking a link to the current hash fires no hashchange; route anyway so focus still happens.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
  });

  var api = {
    model: model, legend: legend, legendById: legendById, fill: FILL, textOn: TEXT, report: report,
    esc: esc, inline: inline, blocks: blocks, tag: tag, toneTag: toneTag, tone: tone, plain: plain,
    openPanel: openPanel, closePanel: closePanel, openNode: openNode,
    findNode: findNode, findSection: findSection, mapNodes: mapNodes, lensTitle: lensTitle, isEnabled: isEnabled,
    go: function (hash) { location.hash = hash; },
    mermaid: renderMermaid, buildFlow: buildFlow, mlabel: mlabel, clickId: clickId, highlight: highlight,
    zoomable: zoomable, statusClassDefs: statusClassDefs, statusClass: statusClass, isDark: isDark
  };

  window.Lenses = {
    register: function (def) { registry[def.id] = def; },
    start: function () {
      document.title = model.title || document.title;
      document.getElementById('appTitle').textContent = model.title || '';
      document.getElementById('appSub').innerHTML = inline(model.subtitle || '');
      document.getElementById('legend').innerHTML = legend.map(function (l) { return tag(l.id); }).join('');
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);

      var actions = document.getElementById('media');
      (model.media || []).forEach(function (m) {
        var a = document.createElement('a');
        a.className = 'btn';
        a.href = m.href;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = '▶ ' + (m.title || 'Video');
        actions.appendChild(a);
      });

      var wanted = model.lenses && model.lenses.length ? model.lenses : ['map', 'reference', 'quiz'];
      wanted.forEach(function (id) {
        var def = registry[id];
        if (!def) { report.errors.push({ where: 'lenses', error: 'no lens registered with id "' + id + '"' }); return; }
        if (def.available && !def.available(model)) { report.errors.push({ where: 'lenses', error: 'lens "' + id + '" has no data in the model' }); return; }
        enabled.push(id);
      });
      report.lenses = enabled.slice();

      var tabs = document.getElementById('lensTabs');
      var stage = document.getElementById('stage');
      enabled.forEach(function (id) {
        var tab = document.createElement('a');
        tab.className = 'lens-tab';
        tab.href = '#' + id;
        tab.setAttribute('role', 'tab');
        tab.textContent = registry[id].title;
        tabs.appendChild(tab);
        var el = document.createElement('section');
        el.className = 'lens';
        el.hidden = true;
        el.setAttribute('data-lens', id);
        stage.appendChild(el);
        state[id] = { el: el, tab: tab, rendered: false, ready: null };
      });

      window.addEventListener('hashchange', route);
      route();
    }
  };
})();

</script>
<script>
Lenses.register({
  id: 'map',
  title: 'Map',
  available: function (m) { return !!(m.map && m.map.nodes && m.map.nodes.length); },

  render: function (el, api) {
    this.api = api;
    this.el = el;
    this.scenario = null;
    var scenarios = api.model.scenarios || [];
    el.innerHTML = '<div class="wrap"><div class="toolbar"></div><p class="hint"></p><div class="diagram"></div></div>';
    var tb = el.querySelector('.toolbar');
    var self = this;
    if (scenarios.length) {
      var html = '<button class="btn" type="button" data-sc="" aria-pressed="true">' + api.esc(api.model.map.baseLabel || 'Base map') + '</button>';
      scenarios.forEach(function (s) {
        html += '<button class="btn" type="button" data-sc="' + api.esc(s.id) + '" aria-pressed="false">' + api.esc(s.title) + '</button>';
      });
      tb.innerHTML = html;
      tb.addEventListener('click', function (e) {
        var b = e.target.closest('[data-sc]');
        if (!b) return;
        var id = b.getAttribute('data-sc');
        self.scenario = id ? scenarios.filter(function (s) { return s.id === id; })[0] : null;
        tb.querySelectorAll('[data-sc]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        api.closePanel();
        self.draw();
      });
    }
    return this.draw();
  },

  change: function (n) {
    var sc = this.scenario;
    return sc && sc.changes && sc.changes[n.id] ? sc.changes[n.id] : null;
  },

  draw: async function () {
    var api = this.api, map = api.model.map, sc = this.scenario, self = this;
    this.el.querySelector('.hint').innerHTML = api.inline(sc ? (sc.summary || '') : (map.hint || 'Click any node for the detail behind it.'));
    var classDefs, classFor;
    if (sc) {
      classDefs = {
        ef_unchanged: 'fill:' + api.fill.muted + ',color:#fff,stroke:none',
        ef_changed: 'fill:' + api.fill.warn + ',color:' + api.textOn.warn + ',stroke:none',
        ef_critical: 'fill:' + api.fill.good + ',color:#fff,stroke:#ffffff,stroke-width:3px',
        ef_removed: 'fill:' + api.fill.bad + ',color:#fff,stroke:#ffffff,stroke-width:2px,stroke-dasharray:6 4',
        ef_added: 'fill:' + api.fill.accent + ',color:#fff,stroke:none'
      };
      classFor = function (n) { var c = self.change(n); return 'ef_' + (c && c.effect ? c.effect : 'unchanged'); };
    } else {
      classDefs = api.statusClassDefs();
      classFor = function (n) { return api.statusClass(n.status); };
    }
    var flow = api.buildFlow({
      direction: map.direction, nodes: map.nodes, edges: map.edges, groups: map.groups,
      classDefs: classDefs, classFor: classFor,
      labelFor: function (n) { var c = self.change(n); return c && c.label ? c.label : (n.label || n.id); },
      onClick: function (n) { self.open(n); }
    });
    this.ids = flow.ids;
    var diagram = this.el.querySelector('.diagram');
    var svg = await api.mermaid(diagram, flow.code, sc ? 'map:' + sc.id : 'map');
    if (svg) api.zoomable(diagram, svg, this.el.querySelector('.toolbar'));
  },

  open: function (n) {
    var api = this.api, sc = this.scenario, c = this.change(n);
    var pre = '';
    if (sc) {
      pre = '<div class="scenario-note"><strong>' + api.esc(sc.title) + ':</strong> ' +
        (c ? api.esc(c.effect || 'changed') + (c.note ? ' — ' + api.inline(c.note) : '') : 'unchanged') + '</div>';
    }
    api.openNode(n, pre);
  },

  focus: function (id, api) {
    var n = api.findNode(id);
    if (!n) return;
    this.open(n);
    if (this.ids && this.ids[id]) api.highlight(this.el.querySelector('.diagram'), this.ids[id]);
  },

  onTheme: function () { return this.draw(); }
});

Lenses.register({
  id: 'reference',
  title: 'Reference',
  available: function (m) { return !!(m.sections && m.sections.length); },

  render: function (el, api) {
    var m = api.model;
    var nodesBySection = {};
    api.mapNodes().forEach(function (n) {
      if (n.section) (nodesBySection[n.section] = nodesBySection[n.section] || []).push(n);
    });

    var toc = m.sections.map(function (s, i) {
      return '<a href="#reference/' + api.esc(s.id) + '" data-sec="' + api.esc(s.id) + '">' + (i + 1) + ' · ' + api.esc(s.title) + '</a>';
    }).join('');

    var legendList = '<ul>' + api.legend.map(function (l) {
      return '<li>' + api.tag(l.id) + ' ' + api.esc(l.description || '') + '</li>';
    }).join('') + '</ul>';

    var suggest = '';
    if ((m.suggested_lenses || []).length) {
      suggest = '<div class="card suggest"><strong>Other lenses that fit this material</strong><ul>' +
        m.suggested_lenses.map(function (s) {
          var name = s.title || api.lensTitle(s.lens);
          var label = api.isEnabled(s.lens) ? '<a href="#' + api.esc(s.lens) + '">' + api.esc(name) + '</a>' : '<strong>' + api.esc(name) + '</strong>';
          return '<li>' + label + ' — ' + api.inline(s.why || '') + '</li>';
        }).join('') + '</ul><p class="muted" style="margin:0">Ask for any of these and it gets added as a new tab.</p></div>';
    }

    var overview = '<div class="overview"><h2>' + api.esc(m.title || '') + '</h2>' +
      (m.summary ? api.blocks(m.summary) : '') +
      (m.source ? '<p class="muted">Source: ' + api.inline(m.source) + '</p>' : '') +
      '<details><summary class="muted">What the tags mean</summary>' + legendList + '</details>' + suggest + '</div>';

    var body = m.sections.map(function (s, i) {
      var onMap = (nodesBySection[s.id] || []);
      var chips = onMap.length && api.isEnabled('map') ? '<div class="chips"><span class="muted" style="font-size:12px">On the map:</span>' +
        onMap.map(function (n) { return '<a class="chip" href="#map/' + api.esc(n.id) + '">' + api.esc(api.plain(n.label)) + '</a>'; }).join('') + '</div>' : '';
      return '<section class="sec" id="ref-' + api.esc(s.id) + '"><h3><span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
        api.esc(s.title) + ' ' + api.tag(s.status) + '</h3>' +
        (s.summary ? '<p class="summary">' + api.inline(s.summary) + '</p>' : '') +
        api.blocks(s.blocks) + chips + '</section>';
    }).join('');

    el.innerHTML = '<div class="ref"><nav class="toc">' + toc + '</nav><div class="content">' + overview + body + '</div></div>';

    var links = Array.prototype.slice.call(el.querySelectorAll('nav.toc a'));
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var id = en.target.id.replace(/^ref-/, '');
        links.forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-sec') === id); });
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    el.querySelectorAll('section.sec').forEach(function (s) { io.observe(s); });
  },

  focus: function (id) {
    var s = document.getElementById('ref-' + id);
    if (!s) return;
    s.scrollIntoView({ behavior: 'smooth', block: 'start' });
    s.classList.remove('flash');
    void s.offsetWidth;
    s.classList.add('flash');
  }
});

Lenses.register({
  id: 'states',
  title: 'State machines',
  available: function (m) { return (m.machines || []).length > 0; },

  render: function (el, api) {
    this.api = api;
    this.el = el;
    this.ids = {};
    var ms = api.model.machines;
    var nav = ms.length > 1 ? '<div class="toolbar">' + ms.map(function (m) {
      return '<a class="chip" href="#states/' + api.esc(m.id) + '">' + api.esc(m.title) + '</a>';
    }).join('') + '</div>' : '';
    el.innerHTML = '<div class="wrap">' + nav + '<p class="hint">Click a state for what it means and how it is entered and left.</p>' +
      ms.map(function (m) {
        return '<div class="card" id="sm-' + api.esc(m.id) + '"><div class="toolbar"><h3 style="margin:0;font-size:16px">' + api.esc(m.title) + '</h3> ' +
          api.tag(m.status) + '</div>' + (m.summary ? '<p class="muted">' + api.inline(m.summary) + '</p>' : '') +
          '<div class="diagram"></div><div class="tx"></div></div>';
      }).join('') + '</div>';
    return this.drawAll();
  },

  drawAll: async function () {
    for (var i = 0; i < this.api.model.machines.length; i++) await this.draw(this.api.model.machines[i]);
  },

  draw: async function (m) {
    var api = this.api, self = this;
    var card = document.getElementById('sm-' + m.id);
    var nodes = m.states.map(function (s) {
      return { id: s.id, label: s.label || s.id, status: s.status, shape: s.terminal ? 'pill' : 'round', _state: s };
    });
    var edges = m.transitions.slice();
    var initial = m.states.filter(function (s) { return s.initial; });
    if (initial.length) {
      nodes.unshift({ id: '__start', label: 'start', shape: 'circle', _start: true });
      initial.forEach(function (s) { edges.unshift({ from: '__start', to: s.id }); });
    }
    var defs = api.statusClassDefs();
    defs.st__start = 'fill:' + api.fill.neutral + ',color:#fff,stroke:none,font-size:11px';
    var flow = api.buildFlow({
      direction: m.direction || 'LR', nodes: nodes, edges: edges, classDefs: defs,
      classFor: function (n) { return n._start ? 'st__start' : api.statusClass(n.status); },
      onClick: function (n) { if (!n._start) self.open(m, n._state); }
    });
    this.ids[m.id] = flow.ids;
    var diagram = card.querySelector('.diagram');
    var svg = await api.mermaid(diagram, flow.code, 'states:' + m.id);
    if (svg) api.zoomable(diagram, svg, card.querySelector('.toolbar'));
    var label = function (id) { var s = m.states.filter(function (x) { return x.id === id; })[0]; return s ? (s.label || s.id) : id; };
    card.querySelector('.tx').innerHTML = api.blocks([{
      type: 'table', head: ['From', 'To', 'When', 'Rule'],
      rows: m.transitions.map(function (t) {
        return [api.plain(label(t.from)), api.plain(label(t.to)), t.label || '', t.guard || ''];
      })
    }]);
  },

  open: function (m, s) {
    var api = this.api;
    var label = function (id) { var x = m.states.filter(function (y) { return y.id === id; })[0]; return x ? api.plain(x.label || x.id) : id; };
    var out = m.transitions.filter(function (t) { return t.from === s.id; });
    var inn = m.transitions.filter(function (t) { return t.to === s.id; });
    var list = function (title, ts, key) {
      if (!ts.length) return '';
      return '<p><strong>' + title + '</strong></p><ul>' + ts.map(function (t) {
        return '<li>' + api.esc(label(t[key])) + (t.label ? ' — ' + api.inline(t.label) : '') + (t.guard ? ' <span class="muted">(' + api.inline(t.guard) + ')</span>' : '') + '</li>';
      }).join('') + '</ul>';
    };
    api.openPanel({
      title: api.plain(s.label || s.id), tags: [api.tag(s.status), s.terminal ? api.toneTag('neutral', 'Final') : '', s.initial ? api.toneTag('neutral', 'Initial') : ''],
      blocks: s.detail, post: '<div class="blocks">' + list('Leaves to', out, 'to') + list('Entered from', inn, 'from') + '</div>',
      links: s.section && api.isEnabled('reference') ? [{ href: '#reference/' + s.section, label: 'Read in Reference →' }] : []
    });
  },

  focus: function (item) {
    var parts = item.split('.');
    var m = this.api.model.machines.filter(function (x) { return x.id === parts[0]; })[0];
    if (!m) return;
    var card = document.getElementById('sm-' + m.id);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (parts[1]) {
      var s = m.states.filter(function (x) { return x.id === parts[1]; })[0];
      if (s) {
        this.open(m, s);
        if (this.ids[m.id]) this.api.highlight(card.querySelector('.diagram'), this.ids[m.id][s.id]);
      }
    }
  },

  onTheme: function () { return this.drawAll(); }
});

Lenses.register({
  id: 'walkthrough',
  title: 'Walkthrough',
  available: function (m) { return (m.walkthroughs || []).length > 0; },

  render: function (el, api) {
    this.api = api;
    this.el = el;
    var ws = api.model.walkthroughs, self = this;
    var hasMap = !!(api.model.map && api.model.map.nodes && api.model.map.nodes.length);
    var picker = ws.length > 1 ? '<div class="toolbar">' + ws.map(function (w) {
      return '<button class="btn" type="button" data-w="' + api.esc(w.id) + '" aria-pressed="false">' + api.esc(w.title) + '</button>';
    }).join('') + '</div>' : '';
    try { this.quizMode = localStorage.getItem('lens-walk-quiz') === '1'; } catch (e) { this.quizMode = false; }
    var modeBar = '<div class="toolbar"><button class="btn" type="button" data-act="quizmode" aria-pressed="' + (this.quizMode ? 'true' : 'false') + '">' +
      'Quiz me at decision points</button><span class="muted" style="font-size:12.5px">' +
      'Off: the story plays straight through. On: you guess at each decision. Use ← → to move.</span></div>';
    el.innerHTML = '<div class="wrap">' + picker + modeBar + '<div class="walk"' + (hasMap ? '' : ' style="grid-template-columns:1fr"') + '>' +
      '<div class="card step"></div>' + (hasMap ? '<div><div class="toolbar mini-tb"></div><div class="diagram"></div></div>' : '') + '</div></div>';
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-go],[data-w],[data-act]');
      if (!b) return;
      if (b.hasAttribute('data-w')) return self.begin(b.getAttribute('data-w'));
      if (b.hasAttribute('data-go')) {
        self.arrivedWrong = b.getAttribute('data-wrong') === '1';
        return self.goto(b.getAttribute('data-go'), true);
      }
      var a = b.getAttribute('data-act');
      if (a === 'answer') return self.answer(Number(b.getAttribute('data-ci')));
      if (a === 'quizmode') {
        self.quizMode = !self.quizMode;
        b.setAttribute('aria-pressed', self.quizMode ? 'true' : 'false');
        try { localStorage.setItem('lens-walk-quiz', self.quizMode ? '1' : '0'); } catch (err) { /* ignore */ }
        return self.show(self.trail[self.trail.length - 1]);
      }
      if (a === 'back' && self.trail.length > 1) { self.trail.pop(); self.show(self.trail[self.trail.length - 1]); }
      if (a === 'restart') self.begin(self.w.id);
    });
    // Arrow keys: right = Next / Continue / See why, left = Back. Unanswered quiz choices still need a click.
    document.addEventListener('keydown', function (e) {
      if (el.hidden || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var card = el.querySelector('.step');
      var target = e.key === 'ArrowLeft' ? card.querySelector('[data-act="back"]')
        : card.querySelector('.answer-box [data-go]') || card.querySelector('.toolbar [data-go]') || card.querySelector('[data-act="restart"]');
      if (target) { e.preventDefault(); target.click(); }
    });
    return this.begin(ws[0].id);
  },

  begin: function (wid) {
    this.w = this.api.model.walkthroughs.filter(function (w) { return w.id === wid; })[0];
    this.el.querySelectorAll('[data-w]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-w') === wid ? 'true' : 'false'); });
    this.trail = [];
    return this.goto(this.w.steps[0].id, true);
  },

  step: function (id) { return this.w.steps.filter(function (s) { return s.id === id; })[0]; },

  goto: function (id, push) {
    if (push) this.trail.push(id);
    return this.show(id);
  },

  show: function (id) {
    var api = this.api, w = this.w, s = this.step(id), self = this;
    if (!s) return;
    var idx = w.steps.indexOf(s);
    var nextId = s.next || (w.steps[idx + 1] && !s.end ? w.steps[idx + 1].id : null);
    var trail = this.trail.map(function (sid) { var x = self.step(sid); return '<span>' + api.esc(x ? self.stepTitle(x) : sid) + '</span>'; }).join('<span>›</span>');
    var flags = this.flags(s);
    var isQuiz = flags.some(function (f) { return f !== null; });
    this.cur = { s: s, flags: flags };
    var shown = s.choices || [];
    var storyAnswer = '';
    // Story mode: a checkpoint with a right answer is not asked; its answer is stated and Next follows it.
    if (isQuiz && !this.quizMode) {
      var right = shown.filter(function (c, i) { return flags[i]; })[0];
      if (right) {
        nextId = right.goto;
        storyAnswer = s.reveal ? api.blocks(s.reveal) : '<p class="story-answer">→ ' + api.inline(right.label) + '</p>';
      }
      shown = [];
    }
    var choices = shown.map(function (c, i) {
      var act = isQuiz ? 'data-act="answer" data-ci="' + i + '"' : 'data-go="' + api.esc(c.goto) + '"';
      return '<button class="choice" type="button" ' + act + '>' + api.inline(c.label) + '</button>';
    }).join('');
    var wrongBanner = this.arrivedWrong ? '<div class="verdict bad">✗ Not quite — here’s why</div>' : '';
    this.arrivedWrong = false;
    var prompt = isQuiz ? 'Which happens next? Pick one.' : 'Choose a path:';
    var nav = '<div class="toolbar" style="margin-top:14px">' +
      (this.trail.length > 1 ? '<button class="btn" type="button" data-act="back">← Back</button>' : '') +
      (!choices && nextId ? '<button class="btn primary" type="button" data-go="' + api.esc(nextId) + '">Next →</button>' : '') +
      (!choices && !nextId ? '<button class="btn primary" type="button" data-act="restart">Start again</button>' : '') + '</div>';
    this.el.querySelector('.step').innerHTML =
      (idx === 0 && w.intro ? '<p class="muted">' + api.inline(w.intro) + '</p>' : '') +
      (this.trail.length > 1 ? '<div class="trail">' + trail + '</div>' : '') +
      wrongBanner + '<div class="stepnum">Step ' + this.trail.length + '</div><h3>' + api.esc(this.stepTitle(s)) + '</h3>' +
      api.blocks(s.blocks) + storyAnswer + (choices ? '<p class="prompt">' + (isQuiz ? '<span class="tag tone-accent">Quiz</span> ' : '') + prompt + '</p>' +
        '<div class="choices">' + choices + '</div><div class="answer-box"></div>' : '') + nav;
    return this.drawMini(s);
  },

  // The step counter already numbers steps; drop "1. " style prefixes authors put in titles.
  stepTitle: function (s) { return String(s.title || s.id).replace(/^\s*\d+(?:\s*[–-]\s*\d+)?\s*[.)]\s+/, ''); },

  // true = right answer, false = wrong, null = a genuine fork (no right answer).
  // Explicit `correct` wins; otherwise a choice whose step rejoins at another choice's target is the wrong one.
  flags: function (s) {
    var self = this, cs = s.choices || [];
    var explicit = cs.map(function (c) { return typeof c.correct === 'boolean' ? c.correct : null; });
    if (explicit.some(function (f) { return f !== null; })) {
      return explicit.map(function (f) { return f === null ? true : f; });
    }
    var gotos = cs.map(function (c) { return c.goto; });
    var wrong = cs.map(function (c) {
      var t = self.step(c.goto);
      return !!(t && t.next && t.next !== c.goto && gotos.indexOf(t.next) !== -1);
    });
    if (cs.length > 1 && wrong.some(Boolean) && !wrong.every(Boolean)) return wrong.map(function (x) { return !x; });
    return cs.map(function () { return null; });
  },

  answer: function (i) {
    var api = this.api, cur = this.cur, c = cur.s.choices[i], ok = cur.flags[i];
    this.el.querySelectorAll('[data-act="answer"]').forEach(function (b) {
      var bi = Number(b.getAttribute('data-ci'));
      b.disabled = true;
      if (cur.flags[bi]) { b.classList.add('right'); b.insertAdjacentHTML('afterbegin', '<span class="mark">✓</span>'); }
      else if (bi === i) { b.classList.add('wrong'); b.insertAdjacentHTML('afterbegin', '<span class="mark">✗</span>'); }
      else b.classList.add('dim');
    });
    this.el.querySelector('.answer-box').innerHTML =
      '<p>' + (ok ? api.toneTag('ok', '✓ Right') : api.toneTag('no', '✗ Not quite')) + '</p>' +
      (ok && cur.s.reveal ? api.blocks(cur.s.reveal) : '') +
      '<button class="btn primary" type="button" data-go="' + api.esc(c.goto) + '" data-wrong="' + (ok ? '0' : '1') + '">' +
      (ok ? 'Continue →' : 'See why →') + '</button>';
  },

  // The map renders once; each step only recolours nodes and moves the camera, so Next feels instant.
  ensureMini: function () {
    if (this.miniReady) return this.miniReady;
    var api = this.api, map = api.model.map, self = this;
    var diagram = this.el.querySelector('.diagram');
    if (!diagram) return Promise.resolve(null);
    var flow = api.buildFlow({
      direction: map.direction, nodes: map.nodes, edges: map.edges, groups: map.groups,
      // No classDefs: mermaid emits them as id-scoped !important rules that would beat the step highlight CSS.
      onClick: function (n) { api.openNode(n); }
    });
    this.miniIds = flow.ids;
    this.miniReady = api.mermaid(diagram, flow.code, 'walkthrough').then(function (svg) {
      if (svg) api.zoomable(diagram, svg, self.el.querySelector('.mini-tb'));
      return svg;
    });
    return this.miniReady;
  },

  drawMini: async function (s) {
    var svg = await this.ensureMini();
    if (!svg) return;
    var diagram = this.el.querySelector('.diagram'), ids = this.miniIds;
    var on = {};
    (s.highlight || []).forEach(function (id) { on[id] = true; });
    var lit = [];
    Object.keys(ids).forEach(function (nid) {
      var g = diagram.querySelector('g.node[id^="flowchart-' + ids[nid] + '-"]');
      if (!g) return;
      g.classList.toggle('wk-on', !!on[nid]);
      g.classList.toggle('wk-off', !on[nid]);
      if (on[nid]) lit.push(g);
    });
    this.camera(diagram, svg, lit);
  },

  // Zoom so the highlighted nodes fill the viewport (within limits), then pan to centre them.
  camera: function (diagram, svg, gs) {
    var st = diagram._zoom;
    if (!st || !diagram._applyZoom) return;
    if (!gs.length) { st.mode = 'fit'; diagram._applyZoom(); diagram.scrollTo(0, 0); return; }
    var vb = svg.viewBox.baseVal;
    var sr = svg.getBoundingClientRect();
    var per = sr.width / vb.width;
    var x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    gs.forEach(function (g) {
      var r = g.getBoundingClientRect();
      x1 = Math.min(x1, (r.left - sr.left) / per); y1 = Math.min(y1, (r.top - sr.top) / per);
      x2 = Math.max(x2, (r.right - sr.left) / per); y2 = Math.max(y2, (r.bottom - sr.top) / per);
    });
    var pad = 80, vw = diagram.clientWidth, vh = diagram.clientHeight;
    var scale = Math.min((vw - pad) / (x2 - x1 + 1), (vh - pad) / (y2 - y1 + 1), 1.15);
    st.mode = 'manual';
    st.scale = Math.max(0.35, scale);
    diagram._applyZoom();
    var cr = diagram.getBoundingClientRect(), sr2 = svg.getBoundingClientRect();
    var offX = sr2.left - cr.left + diagram.scrollLeft, offY = sr2.top - cr.top + diagram.scrollTop;
    var cx = offX + (x1 + x2) / 2 * st.scale, cy = offY + (y1 + y2) / 2 * st.scale;
    // Instant on purpose: smooth scrolling is paused in background tabs and can leave the camera stuck.
    diagram.scrollTo(cx - vw / 2, cy - vh / 2);
  },

  focus: function (item) {
    var parts = item.split('.');
    if (parts[0] !== this.w.id) this.begin(parts[0]);
    if (parts[1] && this.step(parts[1])) this.goto(parts[1], true);
  },

  onTheme: function () { this.miniReady = null; var cur = this.trail[this.trail.length - 1]; return cur ? this.drawMini(this.step(cur)) : null; }
});

Lenses.register({
  id: 'questions',
  title: 'Open questions',
  available: function (m) { return (m.questions || []).length > 0; },

  render: function (el, api) {
    this.api = api;
    this.el = el;
    this.filter = 'unresolved';
    var self = this;
    el.innerHTML = '<div class="wrap"><div class="toolbar">' +
      '<button class="btn" type="button" data-f="unresolved" aria-pressed="true">Unresolved</button>' +
      '<button class="btn" type="button" data-f="resolved" aria-pressed="false">Resolved</button>' +
      '<button class="btn" type="button" data-f="all" aria-pressed="false">All</button></div>' +
      '<p class="hint">What the material leaves unresolved, who owns it, and what it blocks.</p>' +
      '<div class="qgrid"></div><div class="weak"></div></div>';
    el.querySelector('.toolbar').addEventListener('click', function (e) {
      var b = e.target.closest('[data-f]');
      if (!b) return;
      self.filter = b.getAttribute('data-f');
      el.querySelectorAll('[data-f]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      self.draw();
    });
    this.draw();
    this.drawWeak();
  },

  draw: function () {
    var api = this.api, f = this.filter;
    var qs = api.model.questions.filter(function (q) {
      var resolved = q.state === 'resolved';
      return f === 'all' || (f === 'resolved' ? resolved : !resolved);
    });
    var grid = this.el.querySelector('.qgrid');
    if (!qs.length) { grid.innerHTML = '<p class="muted">Nothing here.</p>'; return; }
    grid.innerHTML = qs.map(function (q) {
      var affects = (q.affects || []).map(function (id) {
        var n = api.findNode(id);
        return api.isEnabled('map') && n ? '<a class="chip" href="#map/' + api.esc(id) + '">' + api.esc(api.plain(n.label)) + '</a>' : '';
      }).join('');
      var refs = (q.refs || []).map(function (id) {
        var s = api.findSection(id);
        return api.isEnabled('reference') && s ? '<a class="chip" href="#reference/' + api.esc(id) + '">' + api.esc(s.title) + '</a>' : '';
      }).join('');
      var meta = [q.owner ? 'Owner: ' + api.esc(q.owner) : '', q.raised ? 'Raised: ' + api.esc(q.raised) : ''].filter(Boolean).join(' · ');
      return '<div class="card qcard" id="q-' + api.esc(q.id) + '">' +
        api.tag(q.status || (q.state === 'resolved' ? null : 'open')) + (q.state === 'resolved' ? ' ' + api.toneTag('good', 'Resolved') : '') +
        (q.code ? ' <code>' + api.esc(q.code) + '</code>' : '') +
        '<h3>' + api.esc(q.title) + '</h3>' + (meta ? '<div class="qmeta">' + meta + '</div>' : '') +
        api.blocks(q.blocks) +
        (affects ? '<div class="chips"><span class="muted" style="font-size:12px">Affects:</span>' + affects + '</div>' : '') +
        (refs ? '<div class="chips"><span class="muted" style="font-size:12px">Read:</span>' + refs + '</div>' : '') +
        '</div>';
    }).join('');
  },

  drawWeak: function () {
    var api = this.api, m = api.model;
    var weakTone = function (s) { var t = api.tone(s); return s && (t === 'warn' || t === 'bad'); };
    var items = [];
    api.mapNodes().forEach(function (n) {
      if (weakTone(n.status) && api.isEnabled('map')) items.push('<a class="chip" href="#map/' + api.esc(n.id) + '">' + api.tag(n.status) + ' ' + api.esc(api.plain(n.label)) + '</a>');
    });
    (m.sections || []).forEach(function (s) {
      if (weakTone(s.status) && api.isEnabled('reference')) items.push('<a class="chip" href="#reference/' + api.esc(s.id) + '">' + api.tag(s.status) + ' ' + api.esc(s.title) + '</a>');
    });
    this.el.querySelector('.weak').innerHTML = items.length ?
      '<h3 style="margin-top:28px;font-size:15px">Weak spots: parts tagged as not confirmed</h3><div class="chips">' + items.join('') + '</div>' : '';
  },

  focus: function (id) {
    var q = (this.api.model.questions || []).filter(function (x) { return x.id === id; })[0];
    if (q && q.state === 'resolved' && this.filter === 'unresolved') {
      this.filter = 'all';
      this.el.querySelectorAll('[data-f]').forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute('data-f') === 'all' ? 'true' : 'false'); });
      this.draw();
    }
    var c = document.getElementById('q-' + id);
    if (!c) return;
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
    c.classList.remove('flash');
    void c.offsetWidth;
    c.classList.add('flash');
  }
});

Lenses.register({
  id: 'quiz',
  title: 'Quiz',
  available: function (m) { return (m.quiz || []).length > 0; },

  render: function (el, api) {
    this.api = api;
    this.el = el;
    this.key = 'lens-quiz-missed:' + (api.model.id || api.model.title || 'topic');
    var self = this;
    this.filter = 'all';
    el.innerHTML = '<div class="wrap"><div class="toolbar quiz-kinds"></div><div class="quiz card"></div></div>';
    this.drawKinds();
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (b) self.act(b.getAttribute('data-act'), b);
    });
    document.addEventListener('keydown', function (e) {
      if (el.hidden || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
      if (/^[1-9]$/.test(e.key)) {
        var c = el.querySelector('[data-act="choose"][data-i="' + (Number(e.key) - 1) + '"]');
        if (c) c.click();
      } else if (e.key === 'Enter' || e.key === 'n' || e.key === 'ArrowRight') {
        var nx = el.querySelector('[data-act="next"],[data-act="reveal"]');
        if (nx) nx.click();
      }
    });
    this.start(this.pool());
  },

  KINDS: { essential: 'Essentials', misconception: 'Misconceptions', term: 'Terms' },

  kindLabel: function (k) { return k ? (this.KINDS[k] || k.charAt(0).toUpperCase() + k.slice(1)) : ''; },

  // Indices of questions in the current kind filter.
  pool: function () {
    var f = this.filter;
    return this.api.model.quiz.map(function (_, i) { return i; }).filter(function (i, _, all) {
      return f === 'all' || this.api.model.quiz[i].kind === f;
    }, this);
  },

  drawKinds: function () {
    var api = this.api, self = this, counts = {}, order = [];
    api.model.quiz.forEach(function (q) {
      if (!q.kind) return;
      if (!counts[q.kind]) { counts[q.kind] = 0; order.push(q.kind); }
      counts[q.kind]++;
    });
    var bar = this.el.querySelector('.quiz-kinds');
    if (!order.length) { bar.remove(); return; }
    order.sort(function (a, b) { var k = Object.keys(self.KINDS); return (k.indexOf(a) + 99 * (k.indexOf(a) < 0)) - (k.indexOf(b) + 99 * (k.indexOf(b) < 0)); });
    bar.innerHTML = '<button class="btn" type="button" data-kind="all" aria-pressed="true">All (' + api.model.quiz.length + ')</button>' +
      order.map(function (k) {
        return '<button class="btn" type="button" data-kind="' + api.esc(k) + '" aria-pressed="false">' + api.esc(self.kindLabel(k)) + ' (' + counts[k] + ')</button>';
      }).join('');
    bar.addEventListener('click', function (e) {
      var b = e.target.closest('[data-kind]');
      if (!b) return;
      self.filter = b.getAttribute('data-kind');
      bar.querySelectorAll('[data-kind]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      self.start(self.pool());
    });
  },

  loadMissed: function () {
    try { return JSON.parse(localStorage.getItem(this.key) || '[]'); } catch (e) { return []; }
  },
  saveMissed: function (ids) {
    try { localStorage.setItem(this.key, JSON.stringify(ids)); } catch (e) { /* ignore */ }
  },

  start: function (order) {
    this.order = order;
    this.i = 0;
    this.right = 0;
    this.missedNow = [];
    this.answered = false;
    this.draw();
  },

  current: function () { return this.api.model.quiz[this.order[this.i]]; },

  draw: function () {
    var api = this.api, box = this.el.querySelector('.quiz');
    if (this.i >= this.order.length) return this.drawEnd();
    var q = this.current(), n = this.order.length;
    var pct = Math.round(100 * this.i / n);
    var body = '<div class="progress"><div style="width:' + pct + '%"></div></div>' +
      '<div class="muted" style="font-size:12.5px">Question ' + (this.i + 1) + ' of ' + n +
      (q.kind ? ' \u00b7 <span class="tag tone-accent">' + api.esc(this.kindLabel(q.kind)) + '</span>' : '') + '</div>' +
      '<div class="q">' + api.inline(q.q) + '</div>';
    if (q.choices && q.choices.length) {
      body += q.choices.map(function (c, i) {
        return '<button class="choice" type="button" data-act="choose" data-i="' + i + '"><span class="muted">' + (i + 1) + '.</span> ' + api.inline(c) + '</button>';
      }).join('');
    } else {
      body += '<p class="muted">Answer it in your head first, then reveal.</p><button class="btn primary" type="button" data-act="reveal">Reveal answer</button>';
    }
    body += '<div class="reveal" hidden></div>';
    box.innerHTML = body;
    this.answered = false;
  },

  act: function (what, btn) {
    var q = this.current();
    if (what === 'choose' && !this.answered) {
      var i = Number(btn.getAttribute('data-i'));
      var ok = i === q.answer;
      this.answered = true;
      this.el.querySelectorAll('[data-act="choose"]').forEach(function (b) {
        var bi = Number(b.getAttribute('data-i'));
        if (bi === q.answer) b.classList.add('right');
        else if (bi === i) b.classList.add('wrong');
        b.disabled = true;
      });
      this.score(ok, q);
      this.showReveal(ok, q);
    } else if (what === 'reveal' && !this.answered) {
      this.answered = true;
      btn.remove();
      this.showReveal(null, q);
    } else if (what === 'self') {
      this.score(btn.getAttribute('data-ok') === '1', q);
      this.next();
    } else if (what === 'next') {
      this.next();
    } else if (what === 'restart') {
      this.start(this.pool());
    } else if (what === 'shuffle') {
      var o = this.pool();
      for (var k = o.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = o[k]; o[k] = o[j]; o[j] = t; }
      this.start(o);
    } else if (what === 'missed') {
      var ids = this.loadMissed(), all = this.api.model.quiz;
      var order = this.pool().filter(function (k) { return ids.indexOf(all[k].id) !== -1; });
      if (order.length) this.start(order);
    }
  },

  score: function (ok, q) {
    if (ok) this.right++;
    else this.missedNow.push(q.id);
    var missed = this.loadMissed().filter(function (id) { return id !== q.id; });
    if (!ok) missed.push(q.id);
    this.saveMissed(missed);
  },

  showReveal: function (ok, q) {
    var api = this.api, r = this.el.querySelector('.reveal');
    var verdict = ok === null ? '' : (ok ? api.toneTag('ok', 'Right') : api.toneTag('no', 'Not quite')) + ' ';
    var answerText = q.choices && q.choices.length ? q.choices[q.answer] : q.answer;
    var ref = q.ref ? '<p><a href="#' + api.esc(q.ref) + '">See where this comes from →</a></p>' : '';
    var buttons = ok === null ?
      '<button class="btn" type="button" data-act="self" data-ok="1">I had it</button> <button class="btn" type="button" data-act="self" data-ok="0">I missed it</button>' :
      '<button class="btn primary" type="button" data-act="next">Next →</button>';
    r.innerHTML = '<p>' + verdict + '<strong>' + api.inline(answerText) + '</strong></p>' + api.blocks(q.explain) + ref + buttons;
    r.hidden = false;
  },

  next: function () { this.i++; this.draw(); },

  drawEnd: function () {
    var api = this.api, n = this.order.length, missed = this.loadMissed().length;
    this.el.querySelector('.quiz').innerHTML = '<div class="progress"><div style="width:100%"></div></div>' +
      '<div class="q">' + this.right + ' of ' + n + ' right</div>' +
      (this.missedNow.length ? '<p class="muted">Missed this round: ' + this.missedNow.length + '.</p>' : '<p class="muted">Clean run.</p>') +
      '<div class="toolbar"><button class="btn primary" type="button" data-act="restart">Restart</button>' +
      '<button class="btn" type="button" data-act="shuffle">Shuffle</button>' +
      (missed ? '<button class="btn" type="button" data-act="missed">Retry missed (' + missed + ')</button>' : '') + '</div>';
  },

  focus: function (id) {
    var all = this.api.model.quiz;
    var k = all.map(function (q) { return q.id; }).indexOf(id);
    if (k !== -1) this.start([k]);
  }
});

</script>
<script>Lenses.start();</script>
</body>
