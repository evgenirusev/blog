<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../scripts/images/theme.css"><script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../../scripts/images/connect.js"></script><style>
.st{position:absolute;display:flex;flex-direction:column;gap:6px;padding:16px 18px;width:184px;height:128px}
.st .label{font-size:19px}
.dec{position:absolute;width:120px;height:120px;display:grid;place-items:center}
.dec .shape{position:absolute;inset:14px;transform:rotate(45deg);background:var(--surface);border:1px solid var(--divider);border-radius:14px;box-shadow:var(--shadow)}
.dec .label{position:relative}
.pill{position:absolute;padding:8px 14px;border-radius:999px;background:var(--accent);color:#fff;font-size:16px;font-weight:800}
.yn{position:absolute;font-size:16px;font-weight:800;color:var(--muted)}
</style></head><body data-size="1200x640"><div class="frame">
<div class="title">Orders, as-is: <span class="accent">from checkout to dispatch.</span></div>
<div class="subtitle">An illustrative process map. One step decides the architecture.</div>

<div class="card st" id="a" style="left:64px;top:300px"><span class="icon info"><i data-lucide="shopping-cart"></i></span><div class="label">Customer places an order</div></div>
<div class="card st" id="b" style="left:280px;top:300px"><span class="icon info"><i data-lucide="store"></i></span><div class="label">Order saved in the shop</div></div>
<div class="card st tint-accent" id="c" style="left:496px;top:300px"><span class="icon accent"><i data-lucide="moon"></i></span><div class="label">Nightly sync to the warehouse</div></div>
<div class="pill" style="left:470px;top:244px">The gap: to-be wants same-day</div>
<div class="card st" id="d" style="left:712px;top:300px"><span class="icon info"><i data-lucide="package"></i></span><div class="label">Warehouse picks and packs</div></div>
<div class="dec" id="e" style="left:928px;top:304px"><div class="shape"></div><div class="label">In stock?</div></div>
<div class="card st tint-success" id="f" style="left:896px;top:178px;width:184px;height:68px"><div class="label">Ship it</div></div>
<div class="card st" id="g" style="left:896px;top:484px;width:184px;height:84px"><div class="label">Back-order email</div></div>
<div class="yn" style="left:1000px;top:262px">yes</div>
<div class="yn" style="left:1000px;top:440px">no</div>
</div>
<script>LINKS=[{from:"a",to:"b"},{from:"b",to:"c"},{from:"c",to:"d"},{from:"d",to:"e"},
{from:"e",to:"f",path:"cc",color:"var(--success)"},{from:"e",to:"g",path:"cc",color:"var(--gray)"}];</script>
</body></html>
