<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../scripts/images/theme.css"><script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../../scripts/images/connect.js"></script><style>
.rows{margin-top:44px;display:flex;flex-direction:column;gap:26px}
.r{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:24px}
.r .name{font-size:20px;font-weight:700;color:var(--title);line-height:1.15}
.r .name small{display:block;font-size:16px;font-weight:500;color:var(--muted);margin-top:4px}
.bar{display:flex;height:78px;border-radius:12px;overflow:hidden;border:1px solid var(--divider);background:var(--surface)}
.seg{display:flex;flex-direction:column;justify-content:center;padding:0 12px;font-size:16px;font-weight:600;line-height:1.15;white-space:nowrap}
.seg b{font-size:23px;font-weight:800}
.intent{background:var(--accent-tint);color:var(--accent-deep)}
.dev{background:var(--info-tint);color:var(--info-deep)}
.test{background:var(--plum-tint);color:var(--plum)}
.free{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--canvas-alt) 10px 20px);color:var(--success);align-items:center;font-size:19px;font-weight:800}
.free b{font-size:30px}
</style></head><body data-size="1200x540"><div class="frame">
<div class="eyebrow">Share of one sprint</div>
<div class="title">Now the slice that never moved, <span class="accent">moves.</span></div>
<div class="rows"><div class="r"><div class="name">Traditional sprint</div><div class="bar"><div class="seg intent" style="width:30%"><b>30%</b>Intent &amp; alignment</div><div class="seg dev" style="width:50%"><b>50%</b>Development</div><div class="seg test" style="width:20%"><b>20%</b>Test &amp; deploy</div></div></div><div class="r"><div class="name">AI code generation</div><div class="bar"><div class="seg intent" style="width:30%"><b>30%</b>Intent &amp; alignment</div><div class="seg dev" style="width:10%"><b>10%</b>Dev</div><div class="seg test" style="width:10%"><b>10%</b>Test</div><div class="seg free" style="width:50%"><b>50%</b>reclaimed</div></div></div><div class="r"><div class="name">Full AI-First SDLC<small>intent in the spec</small></div><div class="bar"><div class="seg intent" style="width:10%"><b>10%</b>Intent</div><div class="seg dev" style="width:10%"><b>10%</b>Dev</div><div class="seg test" style="width:10%"><b>10%</b>Test</div><div class="seg free" style="width:70%"><b>70%</b>reclaimed</div></div></div></div></div></body></html>
