<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../scripts/images/theme.css"><script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../../scripts/images/connect.js"></script><style>
.steps{position:absolute;left:64px;right:64px;top:196px;display:flex;justify-content:space-between}
.st{width:184px;display:flex;flex-direction:column;gap:10px;padding:18px 18px}
.st .label{font-size:20px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--surface);background:var(--c)}
.top{display:flex;justify-content:space-between;align-items:center}
</style></head><body data-size="1200x520"><div class="frame">
<div class="title">The day-to-day <span class="accent">loop.</span></div>
<div class="subtitle">All three pillars, in the order you hit them.</div>
<div class="steps">
 <div class="card st" id="a" style="--c:var(--accent)"><div class="top"><span class="num">1</span><span class="icon accent"><i data-lucide="mail"></i></span></div><div class="label">Requirement arrives</div><div class="note">Email, ticket, call</div></div>
 <div class="card st" id="b" style="--c:var(--accent)"><div class="top"><span class="num">2</span><span class="icon accent"><i data-lucide="folder-git-2"></i></span></div><div class="label">Into the knowledge base</div><div class="note">Saved once</div></div>
 <div class="card st" id="c" style="--c:var(--info)"><div class="top"><span class="num">3</span><span class="icon info"><i data-lucide="file-pen"></i></span></div><div class="label">Update the spec</div><div class="note">AI structures it</div></div>
 <div class="card st" id="d" style="--c:var(--info)"><div class="top"><span class="num">4</span><span class="icon info"><i data-lucide="git-compare"></i></span></div><div class="label">PM reviews the diff</div><div class="note">Five minutes, not a meeting</div></div>
 <div class="card st tint-success" id="e" style="--c:var(--success)"><div class="top"><span class="num">5</span><span class="icon success"><i data-lucide="repeat"></i></span></div><div class="label">Agentic loops</div><div class="note">Implement, review, verify</div></div>
</div></div>
<script>LINKS=[{from:"a",to:"b"},{from:"b",to:"c"},{from:"c",to:"d"},{from:"d",to:"e"},
{from:"e",to:"a",path:"bb",dashed:true,drop:60,color:"var(--accent)",label:"…and the loop repeats, every change"}];</script>
</body></html>
